name: Reusable Check Links

on:
  workflow_call:
    inputs:
      lychee-config:
        type: string
        default: ".lychee.toml"
      markdown-glob:
        type: string
        default: "'./**/*.md'"
      definitive-error-regex:
        type: string
        default: "^\\s*\\* \\[(404|410)\\]"
      transient-error-regex:
        type: string
        default: "^\\s*\\* \\[5\\d{2}\\]|^\\s*\\* \\[ERROR\\]|^\\s*\\* \\[TIMEOUT\\]"
      fix-branch:
        type: string
        default: "fix/broken-links"
      issue-assignees:
        type: string
        default: "jslee02"
      infra-ref:
        type: string
        default: "main"
      generate-command:
        type: string
        default: ""
        description: >-
          Regenerates README.md from data after link fixes (e.g. "python3
          scripts/generate_readme.py"), for lists whose README is generated.
    secrets:
      CREATE_PR_TOKEN:
        required: false

jobs:
  check-links:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config ${{ inputs.lychee-config }}
            --verbose
            --no-progress
            ${{ inputs.markdown-glob }}
          fail: false
          output: lychee/results.md

      - name: Fail on definitive broken links
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if grep -qP '${{ inputs.definitive-error-regex }}' lychee/results.md 2>/dev/null; then
            echo "::error::Broken links found:"
            grep -P '${{ inputs.definitive-error-regex }}' lychee/results.md
            exit 1
          fi
          if grep -qP '${{ inputs.transient-error-regex }}' lychee/results.md 2>/dev/null; then
            echo "::warning::Transient failures (not blocking PR):"
            grep -P '${{ inputs.transient-error-regex }}' lychee/results.md
          fi
          echo "No definitive broken links found"

  fix-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config ${{ inputs.lychee-config }}
            --verbose
            --no-progress
            --suggest
            --archive wayback
            ${{ inputs.markdown-glob }}
          # Set as an input, not in args: with the default markdown format the
          # action appends a markdown line to the output, corrupting the JSON.
          format: json
          fail: false
          output: lychee/results.json

      # Even when every link works: a redirect to a parked domain or a 404 page counts as working,
      # and redirects can still be fixed.
      - name: Checkout shared infra
        uses: actions/checkout@v6
        with:
          repository: jslee02/awesome-list-infra
          ref: ${{ inputs.infra-ref }}
          path: .awesome-list-infra

      - name: Fix broken links
        id: fix
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pyyaml
          PYTHONPATH=.awesome-list-infra/src \
            python -m awesome_list_infra.fix_links lychee/results.json

      - name: Regenerate README from fixed data
        if: steps.fix.outputs.fixes_applied == 'true' && inputs.generate-command != ''
        id: regen
        shell: bash
        env:
          GENERATE_COMMAND: ${{ inputs.generate-command }}
          # Generic lists' generators import awesome_list_infra from the checkout above.
          PYTHONPATH: .awesome-list-infra/src
        run: |
          set -euo pipefail
          eval "$GENERATE_COMMAND"
          # Report fixes the generator undid (links it emits itself) and drop an empty PR.
          python -m awesome_list_infra.fix_links --verify lychee/applied-fixes.json

      - name: Create pull request with fixes
        if: steps.fix.outputs.fixes_applied == 'true' && steps.regen.outputs.fixes_applied != 'false'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.CREATE_PR_TOKEN || github.token }}
          signoff: true
          commit-message: "fix: replace broken links with updated URLs"
          # Not the job's own lychee/ reports or the infra checkout.
          add-paths: |
            .
            :(exclude)lychee
            :(exclude).awesome-list-infra
          title: "fix: auto-fix broken links"
          body-path: lychee/fix-summary.md
          branch: ${{ inputs.fix-branch }}
          delete-branch: true
          labels: maintenance

      # Update the open issue from an earlier run rather than opening one every week.
      - name: Find the open unfixable-links issue
        if: steps.fix.outputs.has_unfixable == 'true' || steps.regen.outputs.has_unfixable == 'true'
        id: issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Link Checker: broken links requiring manual fix"
        run: |
          set -euo pipefail
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq "[.[] | select(.title == env.TITLE)][0].number // empty")
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Create or update the issue for unfixable links
        if: steps.fix.outputs.has_unfixable == 'true' || steps.regen.outputs.has_unfixable == 'true'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Link Checker: broken links requiring manual fix"
          content-filepath: lychee/unfixed-links.md
          issue-number: ${{ steps.issue.outputs.number }}
          labels: maintenance
          assignees: ${{ inputs.issue-assignees }}

