name: Reusable Triage Suggestions

# Applies the acceptance bar to resource suggestions: see awesome_list_infra/triage.py.
# The caller owns the triggers and the per-issue concurrency group (see README).

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      infra-ref:
        type: string
        default: "main"
      generator:
        type: string
        default: "scripts/generate_readme.py"
        description: README generator; its SECTIONS registry defines the categories.
      validate-command:
        type: string
        default: "python3 scripts/validate_entries.py"
      workflow-file:
        type: string
        default: "triage.yml"
        description: The caller workflow's file name; sweeps dispatch one run per issue to it.
    secrets:
      CREATE_PR_TOKEN:
        required: false

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Always the default branch: never check out pull request code.
      # With CREATE_PR_TOKEN set, pushed entry branches and PRs trigger CI.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.CREATE_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install triage
        shell: bash
        env:
          INFRA_REF: ${{ inputs.infra-ref }}
        run: pip install pyyaml jsonschema "git+https://github.com/jslee02/awesome-list-infra.git@${INFRA_REF}"

      - name: Triage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_TOKEN: ${{ secrets.CREATE_PR_TOKEN }}
          TRIAGE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TRIAGE_WORKFLOW: ${{ inputs.workflow-file }}
          TRIAGE_GENERATOR: ${{ inputs.generator }}
          TRIAGE_VALIDATE_COMMAND: ${{ inputs.validate-command }}
        run: awesome-list-triage
